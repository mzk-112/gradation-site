<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLASS OF 2027</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="hero">
    <p class="school">SENBOKU HIGH SCHOOL</p>

    <h1>CLASS OF 2027</h1>

    <div class="counter">
      <span id="days">0</span>
      <p id="counter-label">DAYS UNTIL WE GRADUATE</p>
    </div>

    <p class="date">2027.02.26</p>
  </main>

  <script>
    const graduationDay = new Date("2027-02-26T00:00:00");
    const today = new Date();

    const todayDate = new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

    const graduationDate = new Date(
      graduationDay.getFullYear(),
      graduationDay.getMonth(),
      graduationDay.getDate()
    );

    const difference = graduationDate - todayDate;
    const days = Math.floor(Math.abs(difference) / (1000 * 60 * 60 * 24));

    document.getElementById("days").textContent = days;

    if (difference >= 0) {
      document.getElementById("counter-label").textContent =
        "DAYS UNTIL WE GRADUATE";
    } else {
      document.getElementById("counter-label").textContent =
        "DAYS SINCE WE GRADUATED";
    }
  </script>

</body>
</html>
